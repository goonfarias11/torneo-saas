version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: torneo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: torneo
      POSTGRES_PASSWORD: torneo123
      POSTGRES_DB: torneo_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
